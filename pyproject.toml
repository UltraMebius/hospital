[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-doc-eval"
version = "0.1.0"
description = "面向循证医疗 RAG 的文档解析评估与长尾增强工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hospital Research Team"}]
dependencies = [
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
hospital-file = "file.cli:main"
hospital-eval = "hospital_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["file", "src/hospital_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

